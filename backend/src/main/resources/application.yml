spring:
  application:
    name: devpulse-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

devpulse:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: PT15M
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  integrations:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/integrations/github/callback}
      frontend-success-url: ${GITHUB_FRONTEND_SUCCESS_URL:http://localhost:5173/integrations/github}
