spring:
  application:
    name: devpulse-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        # Lets MySQL Connector/J send Hibernate's JDBC batches as multi-row inserts.
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:${BACKEND_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # An unreachable (or unset) SMTP server must never mark the API unhealthy; digests just retry later.
    mail:
      enabled: false

devpulse:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: PT8H
    encryption-key: ${TOKEN_ENCRYPTION_KEY}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  integrations:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/integrations/github/callback}
      frontend-success-url: ${GITHUB_FRONTEND_SUCCESS_URL:http://localhost:5173/app/dashboard}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
  demo:
    enabled: ${DEMO_ENABLED:false}
  admin:
    # Comma-separated; these accounts are always ADMIN (promoted at startup and on registration).
    emails: ${ADMIN_EMAILS:}
  sync:
    auto:
      enabled: ${AUTO_SYNC_ENABLED:true}
      max-age: ${AUTO_SYNC_MAX_AGE:PT6H}
      check-interval: ${AUTO_SYNC_CHECK_INTERVAL:PT15M}
      batch-size: 25
  digest:
    enabled: ${DIGEST_ENABLED:true}
    day-of-week: ${DIGEST_DAY_OF_WEEK:MONDAY}
    hour-utc: ${DIGEST_HOUR_UTC:8}
    check-interval: PT1H
    from: ${MAIL_FROM:}
    app-url: ${FRONTEND_ORIGIN:http://localhost:5173}
